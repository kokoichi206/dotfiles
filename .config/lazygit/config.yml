os:
  editPreset: nvim
customCommands:
  - key: "G"
    context: "files"
    description: "AI commit message (Claude)"
    command: >-
      git diff --cached | claude -p 'Generate a concise commit message. Output ONLY the commit message, nothing else. No prefix like feat: or fix:. Keep the subject line under 72 characters. If the change is simple, use a single line. If complex, add a body separated by a blank line.' > /tmp/lazygit-ai-commit-msg.txt && git commit -e -F /tmp/lazygit-ai-commit-msg.txt && rm -f /tmp/lazygit-ai-commit-msg.txt
    output: "terminal"
