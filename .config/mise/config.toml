# ghq 配下は自リポジトリ・業務リポジトリのみを置く運用のため一括で信頼し、
# リポジトリごとの `mise trust` 手動実行を不要にする
[settings]
trusted_config_paths = ["~/ghq"]

[tools]
bottom = "latest"
bun = "latest"
ecspresso = "2.6"
# go の切り替えは mise が担う。Brewfile の golang.org/dl スタブと併用すると
# 実効バージョンが PATH 順で決まり、機械ごとに食い違う。
go = "1.27"
node = "24"
pnpm = "latest"
python = "3.13"
ruby = "3.3"
rust = "latest"
terraform = "1.13"
yarn = "1.22"
